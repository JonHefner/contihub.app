<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="m-blue" x1="18" y1="12" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c5dcff"/>
      <stop offset="18%" stop-color="#4d82d6"/>
      <stop offset="48%" stop-color="#1e4fa3"/>
      <stop offset="100%" stop-color="#071433"/>
    </linearGradient>
    <linearGradient id="m-blue-hi" x1="22" y1="16" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eef5ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1e4fa3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m-gold" x1="28" y1="20" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6d2"/>
      <stop offset="16%" stop-color="#edd078"/>
      <stop offset="42%" stop-color="#c9a34a"/>
      <stop offset="72%" stop-color="#8b7020"/>
      <stop offset="100%" stop-color="#4a3c0c"/>
    </linearGradient>
    <linearGradient id="m-gold-hi" x1="36" y1="26" x2="68" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#c9a34a" stop-opacity="0"/>
    </linearGradient>
    <filter id="m-brush" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.06" numOctaves="3" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="grain">
        <feFuncA type="linear" slope="0.42"/>
      </feComponentTransfer>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clipped"/>
      <feBlend in="SourceGraphic" in2="clipped" mode="overlay"/>
    </filter>
    <filter id="m-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <radialGradient id="m-vignette" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </radialGradient>
    <linearGradient id="m-flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a34a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0d27a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a34a" stop-opacity="0"/>
    </linearGradient>
    <filter id="m-flare-glow" x="-40%" y="-400%" width="180%" height="900%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#0b0b0d"/>
  
    <path fill="#041028" d="M80.577 29.538 A34 34 0 1 0 80.577 70.462 L70.195 62.638 A21 21 0 1 1 70.195 37.362 Z" transform="translate(1.5 2.1)"/>
    <path fill="url(#m-blue)" d="M80.577 29.538 A34 34 0 1 0 80.577 70.462 L70.195 62.638 A21 21 0 1 1 70.195 37.362 Z" filter="url(#m-brush)"/>
    <path fill="url(#m-blue-hi)" d="M80.577 29.538 A34 34 0 1 0 80.577 70.462 L70.195 62.638 A21 21 0 1 1 70.195 37.362 Z"/>
    <path fill="#3d3208" d="M69.419 39.178 A17.4 17.4 0 1 0 69.419 60.122 L61.513 54.164 A7.5 7.5 0 1 1 61.513 45.136 Z" transform="translate(1.1 1.6)"/>
    <path fill="url(#m-gold)" d="M69.419 39.178 A17.4 17.4 0 1 0 69.419 60.122 L61.513 54.164 A7.5 7.5 0 1 1 61.513 45.136 Z" filter="url(#m-brush)"/>
    <path fill="url(#m-gold-hi)" d="M69.419 39.178 A17.4 17.4 0 1 0 69.419 60.122 L61.513 54.164 A7.5 7.5 0 1 1 61.513 45.136 Z"/>
  
</svg>
